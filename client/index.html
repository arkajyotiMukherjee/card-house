<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 64x64" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=2"
    />
    <link rel="manifest" href="/app.webmanifest?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon-192.png?v=2" />
    <link rel="privacy-policy" href="/privacy/" vite-ignore />
    <link rel="terms-of-service" href="/terms/" vite-ignore />
    <meta name="theme-color" content="#145c38" />
    <title>Card House</title>
    <style>
      html {
        /* Green bars when the window is not 16:9. Theme can change this. */
        --cardhouse-bg: #145c38;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--cardhouse-bg);
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      html,
      body,
      #app,
      canvas {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      input,
      textarea,
      [contenteditable='true'] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--cardhouse-bg);
      }

      canvas {
        /* The canvas owns touch gestures, including sliding along a hand. */
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
